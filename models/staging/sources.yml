version: 2

sources:
  - name: adventure_works
    database: fea_academy
    schema: adventure_works
    tables:
      - name: sales_salesorderdetail
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [salesorderid, salesorderdetailid]
      - name: sales_salesorderheader
        columns:
          - name: salesorderid
            data_tests: [unique, not_null]
      - name: sales_salesorderheadersalesreason
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [salesorderid, salesreasonid]
      - name: sales_salesreason
        columns:
          - name: salesreasonid
            data_tests: [unique, not_null]
      - name: sales_customer
        columns:
          - name: customerid
            data_tests: [unique, not_null]
      - name: sales_creditcard
        columns:
          - name: creditcardid
            data_tests: [unique, not_null]
      - name: sales_store
        columns:
          - name: businessentityid
            data_tests: [unique, not_null]
      - name: person_person
        columns:
          - name: businessentityid
            data_tests: [unique, not_null]
      - name: person_address
        columns:
          - name: addressid
            data_tests: [unique, not_null]
      - name: person_stateprovince
        columns:
          - name: stateprovinceid
            data_tests: [unique, not_null]
      - name: person_countryregion
        columns:
          - name: countryregioncode
            data_tests: [unique, not_null]
      - name: production_product
        columns:
          - name: productid
            data_tests: [unique, not_null]
      - name: production_productsubcategory
        columns:
          - name: productsubcategoryid
            data_tests: [unique, not_null]
      - name: production_productcategory
        columns:
          - name: productcategoryid
            data_tests: [unique, not_null]